<div class="login-form">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="email" class="form-label">Correo Electrónico:</label>
      <input 
        type="email" 
        class="form-control" 
        id="email" 
        formControlName="email"
        placeholder="Ingresa tu correo"
        [class.is-invalid]="emailControl?.invalid && emailControl?.touched">
      <div class="invalid-feedback" *ngIf="emailControl?.invalid && emailControl?.touched">
        <span *ngIf="emailControl?.errors?.['required']">
          {{ validationMessages.email.required }}
        </span>
        <span *ngIf="emailControl?.errors?.['email']">
          {{ validationMessages.email.email }}
        </span>
      </div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña:</label>
      <input 
        type="password" 
        class="form-control" 
        id="password" 
        formControlName="password"
        placeholder="Ingresa tu contraseña"
        [class.is-invalid]="passwordControl?.invalid && passwordControl?.touched">
      <div class="invalid-feedback" *ngIf="passwordControl?.invalid && passwordControl?.touched">
        <span *ngIf="passwordControl?.errors?.['required']">
          {{ validationMessages.password.required }}
        </span>
        <span *ngIf="passwordControl?.errors?.['minlength']">
          {{ validationMessages.password.minlength }}
        </span>
      </div>
    </div>
    <a class="forgot-password" [routerLink]="['/recuperar-password']">Olvidé Mi Contraseña</a>
    <button 
      type="submit" 
      class="btn btn-orange"
      [disabled]="loginForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Ingresando...' : 'INGRESAR' }}
    </button>
  </form>
</div>
