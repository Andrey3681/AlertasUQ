<div class="container py-4">
    <h2 class="fw-bold mb-4">Gestionar Categorías</h2>
    <div class="row">
      <div class="col-md-8">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Descripción</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let categoria of categorias" (click)="seleccionarCategoria(categoria)" style="cursor: pointer;">
              <td>{{ categoria.id }}</td>
              <td>{{ categoria.nombre }}</td>
              <td>{{ categoria.descripcion }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Detalles de la Categoría</h5>
            <div class="mb-3">
              <label class="form-label">Nombre:</label>
              <input type="text" class="form-control" [(ngModel)]="nombre">
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción:</label>
              <textarea class="form-control" [(ngModel)]="descripcion"></textarea>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-success" (click)="crearCategoria()">Crear</button>
              <button class="btn btn-warning" (click)="actualizarCategoria()">Actualizar</button>
              <button class="btn btn-danger" (click)="eliminarCategoria()">Eliminar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
