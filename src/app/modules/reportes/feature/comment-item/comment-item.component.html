<div class="comentario-item">
    <div class="error-message" *ngIf="error">{{ error }}</div>
    
    <div class="comentario-principal">
        <div class="avatar">{{ comentario.autorInicial }}</div>
        <div class="contenido">
            <div class="autor-info">
                <span class="autor-nombre">{{ comentario.autorNombre }}</span>
                <span class="fecha">{{ comentario.fechaCreacion | date:'dd/MM/yyyy HH:mm' }}</span>
            </div>
            <div class="texto">{{ comentario.texto }}</div>
            <div class="acciones">
                <button class="btn btn-link" (click)="darLike()">
                    <i class="bi bi-heart"></i> {{ comentario.likes || 0 }}
                </button>
                <button class="btn btn-link" (click)="toggleRespuesta()">
                    <i class="bi bi-reply"></i> Responder
                </button>
            </div>
        </div>
    </div>

    <!-- Componente de respuesta -->
    <app-comment-reply
        *ngIf="mostrarRespuesta"
        [replyingTo]="comentario.autorNombre"
        (cancelReply)="toggleRespuesta()"
        (submitReply)="onEnviarRespuesta($event)"
        class="ml-4">
    </app-comment-reply>

    <!-- Respuestas al comentario -->
    <div class="respuestas" *ngIf="comentario.respuestas?.length">
        <app-comment-item
            *ngFor="let respuesta of comentario.respuestas"
            [comentario]="respuesta"
            class="ml-4 mt-2">
        </app-comment-item>
    </div>
</div>
