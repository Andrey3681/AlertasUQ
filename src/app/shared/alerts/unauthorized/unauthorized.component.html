<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .unauthorized-container {
      max-width: 300px; /* Ajusta el ancho máximo según necesites */
      margin: 20px auto; /* Centra el componente (para ejemplo) */
      border: 2px solid #20c997; /* Color similar al borde turquesa */
      border-radius: 15px; /* Bordes redondeados */
      overflow: hidden; /* Asegura que los bordes redondeados se apliquen a los hijos */
      background-color: #f9f9f9; /* Fondo gris claro */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Sombra suave */
      text-align: center;
    }

    .unauthorized-header {
      background-color: #fca652; /* Color naranja */
      color: white;
      padding: 15px;
      border-top-left-radius: 13px;
      border-top-right-radius: 13px;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .unauthorized-body {
      padding: 20px;
    }

    .unauthorized-message {
      margin-bottom: 20px;
      font-size: 1rem;
      font-weight: bold;
      color: #333;
    }

    .btn-accept {
      background-color: #fca652; /* Color naranja */
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 25px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-accept:hover {
      background-color: #e08e3e; /* Tono más oscuro al pasar el ratón */
    }
  </style>
</head>
<div class="unauthorized-container">
  <div class="unauthorized-header">
    ¡ALERTA!
  </div>
  <div class="unauthorized-body">
    <p class="unauthorized-message">Usted No Esta Autorizado Para</p>
    <p class="unauthorized-message">Hacer Algun Cambio.</p>
    <button class="btn-accept">Aceptar</button>
  </div>
</div>
