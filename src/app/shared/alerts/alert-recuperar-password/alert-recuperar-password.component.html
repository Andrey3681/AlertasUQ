<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .alert-container {
      border: 2px solid #20c997; /* Color similar al borde turquesa */
      border-radius: 15px; /* Bordes redondeados */
      overflow: hidden; /* Asegura que los bordes redondeados se apliquen a los hijos */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Sombra suave */
      width: 300px; /* Ajusta el ancho según necesites */
      margin: 20px auto; /* Centra el contenedor en la página (para ejemplo) */
    }

    .alert-body {
      border-bottom-left-radius: 13px; /* Redondeo inferior izquierdo */
      border-bottom-right-radius: 13px; /* Redondeo inferior derecho */
    }

    .btn-warning {
      background-color: #fca652 !important; /* Color naranja similar */
      border-color: #fca652 !important;
      color: white !important;
    }

    .btn-warning:hover {
      background-color: #e08e3e !important; /* Un tono más oscuro al pasar el ratón */
      border-color: #e08e3e !important;
    }
  </style>
</head>

<html lang="es">
<div class="alert-container">
  <div class="alert-header bg-warning rounded-top p-3 text-center">
    <h5 class="alert-title text-white fw-bold mb-0">¡ALERTA!</h5>
  </div>
  <div class="alert-body bg-light p-4 text-center">
    <p class="mb-3">Hemos Enviado A Su Correo Electronico</p>
    <p class="mb-3">Los Pasos Para Reestablecer Su Contraseña Olvidada !</p>
    <button class="btn btn-warning rounded-pill px-4 py-2 fw-bold">REGRESAR</button>
  </div>
</div>
